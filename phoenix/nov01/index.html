<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:description" content="Every dish from the Sunday, November 1 Phoenix delivery, with full macros.">
<meta property="og:image" content="https://menu.havnclub.com/phoenix/nov01/img/special.jpg">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Havn Club">

<style>
@font-face{font-family:'Cormorant Garamond';src:url('/assets/fonts/cormorant-latin-500-normal.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('/assets/fonts/cormorant-latin-600-normal.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Cormorant Garamond';src:url('/assets/fonts/cormorant-latin-500-italic.woff2') format('woff2');font-style:italic;font-weight:500;font-display:swap}
@font-face{font-family:'DM Sans';src:url('/assets/fonts/dm-sans-latin-variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--forest:#0A1612;--cream:#F5F1EA;--paper:#FBF8F1;--brass:#C4A87C;--brass-ink:#7A6540;--charcoal:#1C1C1A;--ink-soft:#5C5A55;--line:#DCD5C9;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--charcoal);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--forest);color:var(--cream);text-align:center;padding:36px 16px 30px}
header img{width:72px;height:auto;display:block;margin:0 auto 14px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);font-weight:600;margin:0 0 6px}
h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.1;margin:0}
h1 em{font-style:italic;color:var(--brass)}
header p.sub{color:rgba(245,241,234,.7);margin:10px auto 0;max-width:420px;font-size:14px}
.print-btn{margin-top:18px;background:transparent;border:1px solid var(--brass);color:var(--cream);font:600 13px var(--sans);letter-spacing:.04em;padding:10px 18px;border-radius:999px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:34px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.dish{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.dish:last-child{border-bottom:0}
.dish.noimg{grid-template-columns:1fr}
.dish img{width:140px;height:140px;object-fit:cover;border-radius:10px;display:block;background:var(--cream)}
.tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass-ink);font-weight:700;margin:0}
h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15;margin:2px 0 4px}
.desc{color:var(--ink-soft);font-size:13.5px;margin:0 0 10px}
.macros{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.macros div{text-align:center;padding:7px 2px;border-left:1px solid var(--line)}
.macros div:first-child{border-left:0;background:var(--cream)}
.macros b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.macros span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.diet{margin:8px 0 0;font-size:12px;color:var(--ink-soft)}
.diet .a{color:#8A3B2B}
footer{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:8px 16px 40px;max-width:520px;margin:0 auto}
@media (max-width:520px){
  .dish{grid-template-columns:96px 1fr;gap:12px}
  .dish img{width:96px;height:96px}
  .macros-wrap{grid-column:1 / -1}
  h1{font-size:30px}
}
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:12px}
  header{background:#fff;color:var(--charcoal);padding:0 0 10px;border-bottom:2px solid var(--forest)}
  header img,.print-btn{display:none}
  header p.sub{color:var(--ink-soft)}
  h1 em{color:var(--brass-ink)}
  h2{margin-top:18px}
  .dish{grid-template-columns:90px 1fr;padding:10px 0}
  .dish img{width:90px;height:90px}
}
</style>
</head>
<body>
<header>
  <img src="/assets/brand/havn-club-logo-cream.png" alt="Havn Club" width="72" height="44">
  <p class="eyebrow">Havn Club Phoenix</p>
  <h1>The menu for <em>Sunday, November&nbsp;1</em></h1>
  <p class="sub">Every dish from this delivery, with macros per serving.</p>
  <button class="print-btn" type="button" onclick="window.print()">Save as PDF</button>
</header>
<main id="menu"></main>
<footer>Macros are per serving: calories, then grams of protein, carbs, fat and fiber. Questions? Text the chef at (833)&nbsp;565-1133.</footer>
<script>
(function () {
  /* Phoenix lineup for the Nov 1 2026 delivery: menu.js at havn-menu b4f68ff,
     minus the items cities.js excluded for Phoenix (salads, oats, wellness shots). */
  var SECTIONS = [
    ["Chef Special", [
      ["Birria Beef Bowl", "special", "Adobo braised shredded beef with a mild cilantro salsa verde and roasted corn and peppers and onions over cilantro lime rice.", 659, 64, 55, 21, 5, [["Dairy free"], ["Gluten free"]]]
    ]],
    ["Chicken", [
      ["Peri Peri Chicken", "chicken", "Charred chicken with a peri peri glaze and fire charred sweet corn and roasted cauliflower over coconut rice.", 710, 53, 63, 30, 6, [["Dairy free"], ["Gluten free"]]],
      ["Basil Pesto Chicken", "chicken_2", "Blackened chicken breast over a basil pesto hummus with charred broccoli and roasted sweet potato and pickled red onions.", 608, 62, 35, 24, 10, [["Dairy free"], ["Gluten free"]]]
    ]],
    ["Beef", [
      ["Balsamic Fig Short Ribs", "beef", "Braised short ribs with a balsamic fig glaze and caramelized pearl onions and roasted wild mushrooms over roasted baby potatoes.", 675, 58, 54, 28, 7, [["Dairy free"], ["Gluten free"]]]
    ]],
    ["Seafood", [
      ["Lemon Caper Salmon", "seafood", "Lemon caper salmon with a lemon caper dill sauce and roasted broccoli and beets over lemon herb quinoa.", 678, 56, 32, 36, 8, [["Contains dairy (lemon caper dill sauce)", 1], ["Gluten free"]]],
      ["Garlic Butter Shrimp", "seafood_2", "Garlic herb shrimp with a lemon garlic butter and roasted cauliflower and zucchini over orzo.", 593, 54, 37, 23, 5, [["Contains dairy (butter)", 1], ["Contains gluten (orzo)", 1]]]
    ]],
    ["Pasta", [
      ["Hot Honey Mac and Cheese", "pasta", "Hot honey chicken with a hot honey sauce over creamy mac and cheese.", 775, 50, 54, 39, 2, [["Contains dairy (cheese)", 1], ["Contains gluten (pasta)", 1]]]
    ]],
    ["Vegetarian", [
      ["Chickpea Tikka Masala", "veg", "Seared tofu in a creamy coconut tikka masala with roasted cauliflower and chickpeas over basmati rice.", 753, 40, 68, 33, 12, [["Dairy free"], ["Gluten free"]]]
    ]],
    ["Breakfast & sides", [
      ["Chocolate Chia Pudding", null, "Chocolate chia pudding with a chocolate mascarpone cream and fresh raspberries.", 323, 23, 30, 13, 10, [["Contains dairy (yogurt)", 1], ["Gluten free"]]],
      ["Pumpkin Cheesecake Chia Pudding", null, "Pumpkin spice chia pudding with a maple vanilla mascarpone style cheesecake layer and graham oat crumble.", 454, 25, 39, 17, 10, [["Contains dairy (yogurt, mascarpone)", 1], ["Contains gluten (graham)", 1]]]
    ]],
    ["Broths", [
      ["Classic Bone Broth", null, "Our classic high protein and collagen rich chicken bone broth slow simmered for 24 hours.", 420, 41, 6, 26, 0, [["Dairy free"], ["Gluten free"]]]
    ]]
  ];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var html = SECTIONS.map(function (sec) {
    return "<section><h2>" + esc(sec[0]) + "</h2>" + sec[1].map(function (d) {
      var img = d[1] ? '<img src="/phoenix/nov01/img/' + d[1] + '.jpg" alt="' + esc(d[0]) + '" loading="lazy">' : "";
      var diet = d[8].map(function (t) { return t[1] ? '<span class="a">' + esc(t[0]) + "</span>" : esc(t[0]); }).join(" · ");
      return '<article class="dish' + (d[1] ? "" : " noimg") + '">' + img +
        "<div><p class=\"tag\">" + esc(sec[0]) + "</p><h3>" + esc(d[0]) + '</h3><p class="desc">' + esc(d[2]) + "</p></div>" +
        '<div class="macros-wrap" style="grid-column:' + (d[1] ? "2" : "1") + '"><div class="macros">' +
        "<div><b>" + d[3] + "</b><span>Cal</span></div>" +
        "<div><b>" + d[4] + "g</b><span>Protein</span></div>" +
        "<div><b>" + d[5] + "g</b><span>Carbs</span></div>" +
        "<div><b>" + d[6] + "g</b><span>Fat</span></div>" +
        "<div><b>" + d[7] + "g</b><span>Fiber</span></div>" +
        '</div><p class="diet">' + diet + "</p></div></article>";
    }).join("") + "</section>";
  }).join("");
  document.getElementById("menu").innerHTML = html;
})();
</script>
</body>
</html>
